<?xml version="1.0"?>
<html xmlns="http://www.w3.org/1999/xhtml">
<head><title>本地双语 PDF · 任务工作台</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:13px system-ui,sans-serif;background:#f6f7fa;color:#202536;display:flex;flex-direction:column;padding:12px;gap:8px;min-width:0}
h1{font-size:19px;margin:0}p{line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}p:empty{display:none}header{flex:none;min-width:0}.heading,.toolbar,.pagination{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.heading{justify-content:space-between}.toolbar{margin-top:8px}.toolbar label{display:flex;align-items:center;gap:4px;min-width:0}.toolbar input[type="text"]{flex:1 1 170px;width:170px;min-width:100px}#zlb-counts{color:#536079;margin:5px 0}#zlb-engine-status{color:#315cb5}input,select,button{font:inherit;max-width:100%;min-width:0}input,select{padding:5px;border:1px solid #bdc8d8;border-radius:4px}button{padding:5px 8px;border:1px solid #b9c6d9;border-radius:4px;background:white;color:#203957;cursor:pointer}button:hover{background:#eaf1fc}button:disabled{opacity:.6;cursor:wait}button:focus-visible{outline:2px solid #2863c5;outline-offset:2px}.feedback{margin-top:4px;color:#315cb5}.muted{color:#66738a;font-size:12px}.ellipsis{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:100%;line-height:1.6}
#table-scroll{flex:1;min-height:90px;min-width:0;overflow:auto;border:1px solid #d5dbe5;border-radius:6px;background:white}table{border-collapse:collapse;table-layout:fixed;width:100%}th,td{text-align:left;padding:8px;vertical-align:top;border-bottom:1px solid #e4e9f1;min-width:0}th{background:#eaf0f8;position:sticky;top:0;z-index:1;font-size:12px}th:nth-child(1){width:28%}th:nth-child(2){width:18%}th:nth-child(3){width:15%}th:nth-child(4){width:10%}th:nth-child(5){width:13%}th:nth-child(6){width:16%}.job-status{color:#2455a1;font-weight:600}.job-progress{height:7px;margin-top:6px;background:#e2e8f1;border-radius:4px;overflow:hidden}.job-progress span{display:block;height:100%;background:#2863c5}.task-actions{display:flex;flex-direction:column;gap:5px}.action-group{min-width:0}.action-group button{width:100%;padding:5px 3px}.action-feedback{font-size:12px;margin-top:3px}.details-toggle{width:100%;font-size:12px;color:#536079}.job-details[hidden]{display:none}.job-details td{background:#f4f7fc;padding:10px 12px}.detail-info{font-size:12px;line-height:1.7}.detail-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.detail-actions .action-group{flex:0 1 180px}.import-warning{color:#9a4f15}.pagination{flex:none}.footer-note{font-size:11px;color:#66738a;flex:none}
@media(max-width:720px){thead{display:none}table,tbody{display:block;width:100%}.job-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);padding:8px;gap:6px 12px;border-bottom:1px solid #d5dbe5}.job-row td{display:block;padding:0;border:0}.job-document{grid-column:1/-1}.job-progress-cell,.job-usage{align-self:center}.job-actions{grid-column:1/-1}.task-actions{flex-direction:row;align-items:flex-start}.task-actions>.action-group,.task-actions>.details-toggle{flex:0 1 140px}.job-details{display:block}.job-details td{display:block}.job-row .job-setting::before,.job-row .job-state::before{display:block;color:#66738a;font-size:11px;margin-bottom:2px}.job-setting::before{content:'翻译设置'}.job-state::before{content:'状态 / 阶段'}body{padding:10px}.heading{align-items:flex-start}.footer-note{line-height:1.4}}
</style></head>
<body onload="window.arguments[0].workbench.onLoad(window)">
<header>
<div class="heading"><h1>本地双语 PDF · 工作台</h1><button onclick="window.arguments[0].workbench.refresh(window)">刷新／启动引擎</button></div>
<p id="zlb-engine-status" role="status" aria-live="polite"></p><p id="zlb-counts"></p>
<div class="toolbar"><input type="text" id="zlb-search" aria-label="搜索论文标题或附件" placeholder="搜索论文／附件" oninput="window._zlbOffset=0;window.arguments[0].workbench.refresh(window,false)"/>
<select id="zlb-filter" aria-label="任务状态" onchange="window._zlbOffset=0;window.arguments[0].workbench.refresh(window,false)"><option value="">全部状态</option><option value="running">运行</option><option value="queued">排队</option><option value="paused">暂停</option><option value="failed">失败</option><option value="completed">完成</option><option value="cancelled">取消</option></select>
<label><input id="zlb-hidden" type="checkbox" onchange="window._zlbOffset=0;window.arguments[0].workbench.refresh(window,false)"/>已移除历史</label></div>
<div class="toolbar"><label>同时处理 <select id="zlb-parallel"><option value="1">1 篇</option><option value="2">2 篇</option></select></label><div><button onclick="window.arguments[0].workbench.setParallel(window)">保存并发设置</button><p class="feedback" id="zlb-parallel-status" role="status" aria-live="polite"></p></div></div>
<p class="feedback" id="zlb-workbench-status" role="status" aria-live="polite"></p>
</header>
<div id="table-scroll"><table aria-label="翻译任务"><thead><tr><th>论文／附件</th><th>翻译设置</th><th>状态／阶段</th><th>进度</th><th>用量</th><th>操作</th></tr></thead><tbody id="zlb-jobs"></tbody></table></div>
<div class="pagination"><button onclick="window._zlbOffset=Math.max(0,(window._zlbOffset||0)-25);window.arguments[0].workbench.refresh(window,false)">上一页</button><button onclick="window._zlbOffset=(window._zlbOffset||0)+25;window.arguments[0].workbench.refresh(window,false)">下一页</button><span class="muted" id="zlb-page"></span></div>
<p class="footer-note">长文字省略显示，悬停或展开“详情／更多”查看。关闭窗口不取消任务；移除历史保留文件与累计用量。</p>
</body></html>
